<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デッキ編成 - わくわく学習＆カード</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase_client.js"></script>
    <script src="js/data_manager.js"></script>
    <script src="js/auth_controller.js"></script>
    <!-- 共通カードデータを読み込み -->
    <script src="js/cards_data.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; margin: 0; padding: 20px; text-align: center; min-height: 100vh; }
        body.dark { background: linear-gradient(135deg, #1e272e, #4bcffa); }
        body.pop { background: linear-gradient(135deg, #ff9ff3, #feca57); }
        .screen { background: rgba(255, 255, 255, 0.95); max-width: 650px; margin: 0 auto; padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        h2 { color: #9b59b6; margin-top: 0; }
        
        .deck-status { font-weight: bold; font-size: 18px; margin: 10px 0; color: #2c3e50; }
        .warning-text { color: #e74c3c; font-size: 14px; font-weight: bold; margin-top: 4px; display: none; }
        .slot-container { display: flex; justify-content: center; gap: 12px; margin: 15px 0 20px 0; padding: 15px; background: #f1f2f6; border-radius: 16px; flex-wrap: wrap; }
        .slot-card { width: 90px; height: 130px; background: #fff; border: 3px dashed #b2bec3; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; transition: transform 0.15s; }
        .slot-card.filled { border: 3px solid #2ed573; background: #e8f8f5; box-shadow: 0 4px 10px rgba(46, 213, 115, 0.3); }
        .slot-card.over { border: 3px solid #e74c3c; background: #fadbd8; }
        
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; max-height: 350px; overflow-y: auto; padding: 10px; }
        .card-item { width: 90px; height: 130px; background: #fff; border: 3px solid #9b59b6; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s, border-color 0.15s; user-select: none; }
        .card-item:hover { transform: translateY(-4px); }
        .card-item.selected { border-color: #2ed573; background: #e8f8f5; box-shadow: 0 0 12px #2ed573; opacity: 0.7; }
        .card-power { font-size: 11px; font-weight: bold; color: #e67e22; background: #fff3e0; padding: 2px 6px; border-radius: 8px; margin-top: 4px; }
        
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        button { border: none; padding: 12px 24px; font-size: 18px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; border-radius: 50px; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: translateY(3px); }
        .btn-save { background: #2ed573; color: white; box-shadow: 0 6px 0 #26af5f; }
        .btn-back { background: #7f8fa6; color: white; box-shadow: 0 6px 0 #718093; }
    </style>
</head>
<body id="body-deck">
    <div class="screen">
        <h2>🎴 デッキ編成 (最大3枚)</h2>
        <p>バトルに使うカードを <strong>最大3枚</strong> えらんで「けってい」を押してね！</p>

        <div class="deck-status">
            現在のデッキ (<span id="deck-count">0</span>/3)
            <div id="warning-msg" class="warning-text">⚠️ デッキは最大3枚です！カードをへらしてください。</div>
        </div>
        <div id="deck-slots" class="slot-container"></div>

        <hr style="border: 0; border-top: 2px dashed #ddd; margin: 20px 0;">

        <h3>🎒 しょじカード一覧 (タップしてえらぶ)</h3>
        <div id="deck-grid" class="grid"></div>

        <div class="btn-group">
            <button onclick="saveDeck()" class="btn-save">✅ デッキをけってい</button>
            <button onclick="returnToMenu()" class="btn-back">🏠 メニューにもどる</button>
        </div>
    </div>

    <script>
        document.getElementById('body-deck').className = localStorage.getItem('theme') || 'dark';

        // 共通関数から所持カードを取得
        let playerCollection = getPlayerCollection();

        let selectedIndices = [];
        const savedActiveDeck = JSON.parse(localStorage.getItem('activeDeck')) || [];
        savedActiveDeck.forEach(cardId => {
            const foundIndex = playerCollection.findIndex((id, idx) => id === cardId && !selectedIndices.includes(idx));
            if (foundIndex !== -1) {
                selectedIndices.push(foundIndex);
            }
        });

        function renderDeck() {
            const count = selectedIndices.length;
            document.getElementById('deck-count').textContent = count;
            
            const warningMsg = document.getElementById('warning-msg');
            warningMsg.style.display = count > 3 ? 'block' : 'none';

            // 1. デッキスロット
            const slotsContainer = document.getElementById('deck-slots');
            slotsContainer.innerHTML = '';
            const displaySlots = Math.max(3, count);

            for (let i = 0; i < displaySlots; i++) {
                const targetIndex = selectedIndices[i];
                const slotDiv = document.createElement('div');

                if (targetIndex !== undefined) {
                    const cardId = playerCollection[targetIndex];
                    const card = MASTER_CARDS.find(item => item.id === cardId);
                    
                    const isOver = i >= 3;
                    slotDiv.className = `slot-card filled ${isOver ? 'over' : ''}`;
                    slotDiv.innerHTML = `
                        <div style="font-size:32px;">${card.icon}</div>
                        <div style="font-size:10px; font-weight:bold; color:#333;">${card.name}</div>
                        <div class="card-power">P:${card.power}</div>
                    `;
                    slotDiv.onclick = () => toggleSelect(targetIndex);
                } else {
                    slotDiv.className = 'slot-card';
                    slotDiv.innerHTML = `<div style="font-size:24px; color:#ccc;">➕</div><div style="font-size:10px; color:#aaa;">わく ${i+1}</div>`;
                }
                slotsContainer.appendChild(slotDiv);
            }

            // 2. 所持カード一覧
            const grid = document.getElementById('deck-grid');
            grid.innerHTML = '';

            if (playerCollection.length === 0) {
                grid.innerHTML = '<p style="color:#777;">カードをもっていません。ガチャ等でカードをゲットしよう！</p>';
                return;
            }

            playerCollection.forEach((id, index) => {
                const card = MASTER_CARDS.find(item => item.id === id);
                if (!card) return;

                const isSelected = selectedIndices.includes(index);
                const div = document.createElement('div');
                div.className = `card-item ${isSelected ? 'selected' : ''}`;
                div.innerHTML = `
                    <div style="font-size:32px;">${card.icon}</div>
                    <div style="font-size:10px; font-weight:bold; color:#333;">${card.name}</div>
                    <div class="card-power">P:${card.power}</div>
                `;
                div.onclick = () => toggleSelect(index);
                grid.appendChild(div);
            });
        }

        function toggleSelect(index) {
            const pos = selectedIndices.indexOf(index);
            if (pos !== -1) {
                selectedIndices.splice(pos, 1);
            } else {
                selectedIndices.push(index);
            }
            renderDeck();
        }

        function saveDeck() {
            if (selectedIndices.length > 3) {
                alert("⚠️ デッキは最大3枚までです！\n4枚以上えらばれています。カードをへらしてから「けってい」を押してください。");
                return;
            }

            const activeDeck = selectedIndices.map(idx => playerCollection[idx]);
            localStorage.setItem('activeDeck', JSON.stringify(activeDeck));

            alert("✅ デッキをほぞんしました！");
            location.href = 'menu.html';
        }

        function returnToMenu() {
            location.href = 'menu.html';
        }

        renderDeck();
    </script>
</body>
</html>
