<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>デッキ編成 - わくわく学習＆カード</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase_client.js"></script>
    <script src="js/data_manager.js"></script>
    <script src="js/auth_controller.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; margin: 0; padding: 20px; text-align: center; min-height: 100vh; }
        body.dark { background: linear-gradient(135deg, #1e272e, #4bcffa); }
        body.pop { background: linear-gradient(135deg, #ff9ff3, #feca57); }
        .screen { background: rgba(255, 255, 255, 0.95); max-width: 650px; margin: 0 auto; padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        button { background: #9b59b6; color: white; border: none; padding: 12px 24px; margin: 8px; font-size: 18px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #8e44ad; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
        .card-item { width: 90px; height: 130px; background: #fff; border: 3px solid #9b59b6; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .card-item.selected { border-color: #2ed573; background: #e8f8f5; box-shadow: 0 0 10px #2ed573; }
    </style>
</head>
<body id="body-deck">
    <div class="screen">
        <h2 style="color:#9b59b6;">🎴 デッキ編成 (3枚選択)</h2>
        <p>バトルに使うカードを3枚えらんでね</p>
        <div id="deck-grid" class="grid"></div>
        <button onclick="location.href='index.html'" style="background: #7f8fa6; box-shadow: 0 6px 0 #718093;">🏠 メニューにもどる</button>
    </div>

    <script>
        // 設定されたテーマ（dark / pop）を反映
        document.getElementById('body-deck').className = localStorage.getItem('theme') || 'dark';

        let playerCollection = JSON.parse(localStorage.getItem('playerCollection')) || [];
        let activeDeck = JSON.parse(localStorage.getItem('activeDeck')) || [1,2,3];
        const emojis = ["🦸‍♂️","🐉","🛡️","🔥","💧","⚡","👑","💎","🤖","👻","🦊","🐯","🐸","🦅","🦈","🦄","🌟","🚀","🎯","🎨"];
        const masterCards = Array.from({length: 20}, (_, i) => ({ id: i + 1, name: `No.${i + 1}`, img: emojis[i], power: 35 + (i * 3) }));

        function renderDeck() {
            let grid = document.getElementById('deck-grid');
            grid.innerHTML = '';
            playerCollection.forEach(id => {
                let c = masterCards.find(item => item.id === id);
                let isSelected = activeDeck.includes(id);
                let div = document.createElement('div');
                div.className = `card-item ${isSelected ? 'selected' : ''}`;
                div.innerHTML = `<div style="font-size:32px;">${c.img}</div><div style="font-size:10px; font-weight:bold; color:#333;">${c.name}</div>`;
                div.onclick = () => toggleSelect(id);
                grid.appendChild(div);
            });
        }

        function toggleSelect(id) {
            if (activeDeck.includes(id)) {
                if (activeDeck.length <= 1) return alert("最低1枚は必要です");
                activeDeck = activeDeck.filter(i => i !== id);
            } else {
                if (activeDeck.length >= 3) return alert("デッキは3枚までです");
                activeDeck.push(id);
            }
            localStorage.setItem('activeDeck', JSON.stringify(activeDeck));
            renderDeck();
        }

        renderDeck();
    </script>
</body>
</html>
