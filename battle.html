<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バトル - わくわく学習＆カード</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase_client.js"></script>
    <script src="js/data_manager.js"></script>
    <script src="js/auth_controller.js"></script>
    <script src="js/cards_data.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; margin: 0; padding: 15px; text-align: center; min-height: 100vh; box-sizing: border-box; }
        body.dark { background: linear-gradient(135deg, #1e272e, #4bcffa); }
        body.pop { background: linear-gradient(135deg, #ff9ff3, #feca57); }
        
        .screen { background: rgba(255, 255, 255, 0.96); max-width: 680px; margin: 0 auto; padding: 20px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
        
        button { background: linear-gradient(180deg, #ff6b81, #ff4757); color: white; border: none; padding: 12px 24px; margin: 6px; font-size: 16px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #c23616; transition: transform 0.1s, background 0.2s; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #c23616; }
        button:disabled { background: #dcdde1 !important; box-shadow: 0 4px 0 #b2bec3 !important; cursor: not-allowed; filter: grayscale(1); transform: none !important; }

        .diff-btn { width: 100%; max-width: 500px; padding: 16px 20px; margin: 12px auto; font-size: 19px; text-align: left; display: flex; justify-content: space-between; align-items: center; border-radius: 18px; box-sizing: border-box; }
        .diff-btn .reward-badge { font-size: 14px; background: rgba(0,0,0,0.25); padding: 5px 12px; border-radius: 20px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

        .playmat { background: radial-gradient(circle at center, #2f3640 0%, #191c21 100%); border-radius: 20px; padding: 16px; box-shadow: inset 0 0 25px rgba(0,0,0,0.8); position: relative; margin-bottom: 12px; border: 3px solid #576574; overflow: hidden; }
        .tcg-card { width: 110px; height: 150px; background: linear-gradient(135deg, #f5f6fa, #dcdde1); border-radius: 12px; border: 4px solid #f1c40f; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 4px; position: relative; box-sizing: border-box; margin: 0 auto; z-index: 2; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tcg-card-enemy { border-color: #8c7ae6; background: linear-gradient(135deg, #e84118, #c23616); color: white; }
        .tcg-card-img { font-size: 46px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3)); margin-top: 2px; }
        .tcg-card-name { font-size: 11px; font-weight: 900; background: rgba(255,255,255,0.85); color: #333; padding: 2px 6px; border-radius: 10px; width: 90%; text-align: center; }

        .arena-row { display: flex; justify-content: center; align-items: center; gap: 16px; position: relative; margin-bottom: 12px; }
        .arena-stats { background: rgba(255,255,255,0.12); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.25); border-radius: 14px; padding: 10px 12px; color: white; text-align: left; width: 140px; font-size: 13px; }
        .hp-bar-container { background: rgba(0,0,0,0.6); border-radius: 10px; height: 14px; width: 100%; margin: 4px 0; border: 1px solid #7f8fa6; overflow: hidden; }
        .hp-bar-fill { height: 100%; background: linear-gradient(90deg, #2ed573, #7bed9f); width: 100%; transition: width 0.4s; }
        .energy-container { display: flex; gap: 4px; flex-wrap: wrap; min-height: 16px; margin-top: 4px; }
        .energy-token { width: 13px; height: 13px; background: radial-gradient(circle at 30% 30%, #fbc531, #e1b12c); border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 4px rgba(251, 197, 49, 0.8); }

        .action-btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
        .action-btn { font-size: 14px; padding: 10px 8px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; border: none; cursor: pointer; }
        .action-btn .btn-title { font-weight: 900; font-size: 15px; }
        .action-btn .btn-desc { font-size: 10px; opacity: 0.9; font-weight: 500; }
        .action-btn .btn-cost { font-size: 10px; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 10px; margin-top: 2px; }

        .action-btn.end-turn { grid-column: span 2; background: linear-gradient(180deg, #a4b0be, #747d8c); color: white; box-shadow: 0 4px 0 #576574; font-size: 16px; min-height: 48px; }
        
        .hand-card { border: 2px solid #ff4757; border-radius: 10px; background: #fff; padding: 6px; text-align: center; cursor: pointer; min-width: 65px; color:#333; transition: transform 0.1s; position: relative; }
        .hand-card:hover { transform: translateY(-4px); }
        .hand-card .swap-tag { font-size: 9px; background: #ff4757; color: white; border-radius: 6px; padding: 1px 4px; position: absolute; top:-6px; right:-6px; font-weight:bold; }

        .top-bar-btn { font-size: 13px; padding: 6px 14px; margin: 0; box-shadow: 0 3px 0 rgba(0,0,0,0.2); }

        /* アニメーション用クラス */
        @keyframes attackPlayer {
            0% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-40px) scale(1.15); }
            100% { transform: translateY(0) scale(1); }
        }
        @keyframes attackEnemy {
            0% { transform: translateY(0) scale(1); }
            40% { transform: translateY(40px) scale(1.15); }
            100% { transform: translateY(0) scale(1); }
        }
        @keyframes hitShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 6px); filter: brightness(1.8) sepia(1) hue-rotate(-50deg); }
            40% { transform: translate(8px, -6px); }
            60% { transform: translate(-6px, 4px); }
            80% { transform: translate(6px, -4px); }
        }
        @keyframes cardSwapIn {
            0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes playmatShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-6px, 6px); }
            50% { transform: translate(6px, -6px); }
            75% { transform: translate(-4px, -4px); }
        }

        .anim-attack-p { animation: attackPlayer 0.4s ease-in-out; }
        .anim-attack-e { animation: attackEnemy 0.4s ease-in-out; }
        .anim-hit { animation: hitShake 0.4s ease-in-out; }
        .anim-swap { animation: cardSwapIn 0.35s ease-out; }
        .anim-shake-screen { animation: playmatShake 0.3s ease-in-out; }
    </style>
</head>
<body id="body-battle">
    <!-- バトル準備画面 -->
    <div id="battle-prep-screen" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h2 style="color:#ff4757; margin: 0; font-size:26px;">⚔️ バトル難易度選択</h2>
            <button id="bgm-toggle-prep" onclick="toggleBGM()" class="top-bar-btn" style="background:#2e86de;">🔊 BGM: ON</button>
        </div>
        <p style="font-size: 16px; color:#555; margin-bottom:20px;">あいての強さをえらんでね！勝つとごほうびがもらえるよ！</p>
        
        <div style="margin: 20px 0;">
            <button onclick="startCardBattle('easy')" class="diff-btn" style="background: linear-gradient(180deg, #2ed573, #26af5f); box-shadow: 0 5px 0 #1b8a45;">
                <span>★ かんたん</span>
                <span class="reward-badge">💰 50枚</span>
            </button>
            <button onclick="startCardBattle('normal')" class="diff-btn" style="background: linear-gradient(180deg, #ffa502, #e1b12c); box-shadow: 0 5px 0 #c88f18;">
                <span>★★ ふつう</span>
                <span class="reward-badge">💰 100枚 🎁 1パック</span>
            </button>
            <button onclick="startCardBattle('hard')" class="diff-btn" style="background: linear-gradient(180deg, #ff4757, #ff6b81); box-shadow: 0 5px 0 #c23616;">
                <span>★★★ つよい</span>
                <span class="reward-badge">💰 200枚 🎁 2パック</span>
            </button>
        </div>

        <button onclick="location.href='index.html'" style="background: #7f8fa6; box-shadow: 0 4px 0 #718093; margin-top:15px; font-size:17px; padding:12px 30px;">🏠 メニューにもどる</button>
    </div>

    <!-- バトル実行画面 -->
    <div id="battle-action-screen" class="screen" style="display:none; background: rgba(30, 39, 46, 0.96); color:white;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <div id="battle-turn-indicator" style="font-size: 16px; color: #7bed9f; font-weight: 900;">▶ あなたのターン！</div>
            <div>
                <button id="bgm-toggle-action" onclick="toggleBGM()" class="top-bar-btn" style="background:#2e86de; margin-right:6px;">🔊 BGM: ON</button>
                <button onclick="abortBattle()" class="top-bar-btn" style="background:#e74c3c;">🏳️ やめる</button>
            </div>
        </div>
        
        <div id="main-playmat" class="playmat">
            <!-- てきエリア -->
            <div class="arena-row">
                <div class="tcg-card tcg-card-enemy" id="enemy-card">
                    <div class="tcg-card-name" id="enemy-name">怪獣</div>
                    <div class="tcg-card-img">🦖</div>
                    <div style="font-size: 10px; font-weight:bold;">POWER: ???</div>
                    <div id="enemy-defense-badge" style="display:none; position:absolute; top:-10px; right:-10px; font-size:22px;">🛡️</div>
                </div>
                <div class="arena-stats">
                    <div style="font-size:11px; opacity:0.8;">ENEMY HP</div>
                    <div style="font-size: 15px; font-weight:900; text-align:right;"><span id="enemy-hp-text">100</span> / <span id="enemy-max-hp">100</span></div>
                    <div class="hp-bar-container"><div id="enemy-hp-fill" class="hp-bar-fill" style="background:linear-gradient(90deg, #ff4757, #ff6b81);"></div></div>
                    <div style="font-size:11px; margin-top:6px;">エネルギー: <b id="enemy-energy-num" style="color:#fbc531;">3</b>/10</div>
                    <div id="enemy-energy-container" class="energy-container"></div>
                </div>
            </div>

            <!-- プレイヤーエリア -->
            <div class="arena-row" style="margin-bottom:0;">
                <div class="arena-stats">
                    <div style="font-size:11px; opacity:0.8; color:#f1c40f;">YOUR HP</div>
                    <div style="font-size: 15px; font-weight:900; text-align:right;"><span id="player-hp-text">100</span> / <span id="player-max-hp">100</span></div>
                    <div class="hp-bar-container"><div id="player-hp-fill" class="hp-bar-fill"></div></div>
                    <div style="font-size:11px; margin-top:6px;">エネルギー: <b id="player-energy-num" style="color:#fbc531;">3</b>/10</div>
                    <div id="player-energy-container" class="energy-container"></div>
                </div>
                <div class="tcg-card" id="player-card">
                    <div class="tcg-card-name" id="active-card-name">カード名</div>
                    <div class="tcg-card-img" id="active-card-img">🐥</div>
                    <div style="font-size: 10px; font-weight:bold; color:#333;">POWER: <span id="active-card-power">30</span></div>
                    <div id="player-defense-badge" style="display:none; position:absolute; top:-10px; left:-10px; font-size:22px;">🛡️</div>
                </div>
            </div>
        </div>

        <div id="battle-log-msg" style="font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 10px; margin: 8px 0; border:1px solid rgba(255,255,255,0.1); color:#fff;">バトル開始！</div>

        <div id="battle-controls" class="action-btn-grid">
            <button id="card-attack-btn" class="action-btn" onclick="playerAction('attack')" style="background: linear-gradient(180deg, #ff6b81, #ff4757); box-shadow:0 4px 0 #c23616;">
                <span class="btn-title">🔥 こうげき</span>
                <span class="btn-desc">カードの強さでダメージ！</span>
                <span class="btn-cost">⚡ エネ -3</span>
            </button>
            <button id="card-defend-btn" class="action-btn" onclick="playerAction('defend')" style="background: linear-gradient(180deg, #70a1ff, #1e90ff); box-shadow:0 4px 0 #1e90ff;">
                <span class="btn-title">🛡️ ぼうぎょ</span>
                <span class="btn-desc">つぎ受けるダメージをはんぶん！</span>
                <span class="btn-cost">⚡ エネ -1</span>
            </button>
            <button id="card-heal-btn" class="action-btn" onclick="playerAction('heal')" style="background: linear-gradient(180deg, #7bed9f, #2ed573); box-shadow:0 4px 0 #2ed573;">
                <span class="btn-title">💚 回復</span>
                <span class="btn-desc">HPを少し回復する</span>
                <span class="btn-cost">⚡ エネ -1</span>
            </button>
            <button id="card-draw-btn" class="action-btn" onclick="playerAction('draw')" style="background: linear-gradient(180deg, #fbc531, #e1b12c); box-shadow:0 4px 0 #e1b12c;">
                <span class="btn-title">📥 カード引く</span>
                <span class="btn-desc">山札から手札へ1枚ひく</span>
                <span class="btn-cost">⚡ エネ -1</span>
            </button>
            <button id="end-turn-btn" class="action-btn end-turn" onclick="endPlayerTurn()">
                <span>⏩ ターン終了（エネ+2 ためて敵の番へ）</span>
            </button>
        </div>
        
        <div style="margin-top: 10px; background: rgba(255,255,255,0.92); border-radius: 12px; padding: 8px 10px; color:#333;">
            <div style="font-size: 12px; font-weight: 900; margin-bottom: 4px; text-align: left;">
                <span>手札（クリックで交代 / ⚡ エネ -1）</span>
            </div>
            <div id="player-hand-container" style="display: flex; gap: 8px; overflow-x: auto; min-height: 55px; padding: 4px 2px;"></div>
        </div>
    </div>

    <!-- リザルト画面 -->
    <div id="battle-result-screen" class="screen" style="display:none;">
        <h2 style="color:#ff4757; margin:10px 0; font-size:28px;">⚔️ バトル結果 ⚔️</h2>
        <div id="battle-result-text" style="font-size: 20px; margin: 25px 0; font-weight: 900; line-height:1.6;"></div>
        <button onclick="location.href='index.html'" style="background: #7f8fa6; box-shadow: 0 4px 0 #718093; font-size:18px; padding:12px 30px;">🏠 メニューへもどる</button>
    </div>

    <script>
        document.getElementById('body-battle').className = localStorage.getItem('theme') || 'dark';
        let coins = parseInt(localStorage.getItem('coins')) || 100;
        let packs = parseInt(localStorage.getItem('packs')) || 0;
        let activeDeck = JSON.parse(localStorage.getItem('activeDeck')) || [];
        let bgmOn = localStorage.getItem('bgmOn') !== 'false';

        let battleState = {};

        // 戦闘曲のプレイリスト（ランダムシームレス切り替え用）
        const BGM_TRACKS = ['The_Final_Blow.mp3', 'Steel_Against_the_Throne.mp3'];
        let activeAudio = null; // 現在再生中のAudioオブジェクト

        const DIFFICULTY_SETTINGS = {
            easy: { name: 'かんたん', enemyHp: 100, rewardCoins: 50, rewardPacks: 0 },
            normal: { name: 'ふつう', enemyHp: 180, rewardCoins: 100, rewardPacks: 1 },
            hard: { name: 'つよい', enemyHp: 280, rewardCoins: 200, rewardPacks: 2 }
        };

        function getSafeCollection() {
            if (typeof getPlayerCollection === 'function') {
                return getPlayerCollection();
            }
            return JSON.parse(localStorage.getItem('myCards')) || [1, 2, 3];
        }

        // 戦闘曲をランダムに選んで再生し、曲が終わったらシームレスに次のランダム曲へ繋ぐ
        function playRandomBattleBGM() {
            if (!bgmOn) return;
            if (activeAudio) {
                activeAudio.pause();
                activeAudio = null;
            }

            let randomTrack = BGM_TRACKS[Math.floor(Math.random() * BGM_TRACKS.length)];
            activeAudio = new Audio(randomTrack);
            activeAudio.volume = 0.8;
            
            activeAudio.play().then(() => {
                // 曲が終了したらクロスフェード風または途切れなく次の曲をランダム再生
                activeAudio.onended = () => {
                    if (bgmOn) {
                        playRandomBattleBGM();
                    }
                };
            }).catch(err => console.log("BGM再生エラー:", err));
        }

        function stopBGM() {
            if (activeAudio) {
                activeAudio.pause();
                activeAudio.currentTime = 0;
                activeAudio = null;
            }
        }

        function playSpecialBGM(filename) {
            stopBGM();
            if (!bgmOn) return;
            let spAudio = new Audio(filename);
            spAudio.play().catch(err => console.log("特殊BGM再生エラー:", err));
            activeAudio = spAudio; // 管理下に置く
        }

        function toggleBGM() {
            bgmOn = !bgmOn;
            localStorage.setItem('bgmOn', bgmOn ? 'true' : 'false');
            updateBgmButtonUI();
            if (bgmOn) {
                playRandomBattleBGM();
            } else {
                stopBGM();
            }
        }

        function updateBgmButtonUI() {
            let label = bgmOn ? '🔊 BGM: ON' : '🔇 BGM: OFF';
            document.getElementById('bgm-toggle-prep').innerText = label;
            document.getElementById('bgm-toggle-action').innerText = label;
        }

        function triggerAnim(elementId, className, duration = 400) {
            let el = document.getElementById(elementId);
            if (!el) return;
            el.classList.remove(className);
            void el.offsetWidth; // リフロー発生でアニメーションをリセット
            el.classList.add(className);
            setTimeout(() => el.classList.remove(className), duration);
        }

        function startCardBattle(diffKey) {
            let config = DIFFICULTY_SETTINGS[diffKey] || DIFFICULTY_SETTINGS.easy;
            let currentDeck = activeDeck.length > 0 ? activeDeck : getSafeCollection();
            if (!currentDeck || currentDeck.length === 0) currentDeck = [1, 2, 3];

            document.getElementById('battle-prep-screen').style.display = 'none';
            document.getElementById('battle-action-screen').style.display = 'block';
            updateBgmButtonUI();
            playRandomBattleBGM(); // ランダム戦闘曲スタート

            battleState = {
                enemyMaxHp: config.enemyHp,
                enemyHp: config.enemyHp,
                rewardCoins: config.rewardCoins,
                rewardPacks: config.rewardPacks,
                enemyEnergy: 3, 
                enemyDefending: false,
                deck: [...currentDeck].sort(() => Math.random() - 0.5),
                hand: [], 
                activeCard: null,
                playerMaxHp: 100, 
                playerHp: 100, 
                playerEnergy: 3, 
                playerDefending: false,
                turnState: 'player'
            };

            while(battleState.deck.length < 3) battleState.deck.push(...currentDeck);
            battleState.deck.sort(() => Math.random() - 0.5);

            for (let i = 0; i < Math.min(2, battleState.deck.length); i++) {
                battleState.hand.push(battleState.deck.pop());
            }
            setCardToActive(battleState.deck.pop() || currentDeck[0]);
            
            document.getElementById('battle-turn-indicator').innerText = "▶ あなたのターン！";
            document.getElementById('battle-turn-indicator').style.color = "#7bed9f";
            logMsg(`⚔️ バトル開始！ 最初のターンです。`);
            updateBattleUI();
        }

        function abortBattle() {
            if (confirm("本当にバトルを途中でやめますか？")) {
                stopBGM();
                location.href = 'index.html';
            }
        }

        function setCardToActive(cardId) {
            let cId = (typeof cardId === 'object') ? cardId.id : cardId;
            let rawCard = (typeof MASTER_CARDS !== 'undefined') ? MASTER_CARDS.find(c => c.id === cId) : null;
            if (!rawCard) rawCard = { id: cId, name: 'カード', icon: '🃏', power: 30 };
            
            battleState.activeCard = { ...rawCard };
            let powerVal = rawCard.power || 30;
            battleState.playerMaxHp = 60 + Math.floor(powerVal * 0.8);
            battleState.playerHp = battleState.playerMaxHp;
            battleState.playerDefending = false;

            triggerAnim('player-card', 'anim-swap', 350);
        }

        function updateBattleUI() {
            // 敵UI
            document.getElementById('enemy-hp-text').innerText = battleState.enemyHp;
            document.getElementById('enemy-max-hp').innerText = battleState.enemyMaxHp;
            document.getElementById('enemy-hp-fill').style.width = `${Math.max(0, (battleState.enemyHp / battleState.enemyMaxHp) * 100)}%`;
            document.getElementById('enemy-energy-num').innerText = battleState.enemyEnergy;
            document.getElementById('enemy-energy-container').innerHTML = Array(Math.min(battleState.enemyEnergy, 10)).fill('<div class="energy-token"></div>').join('');
            document.getElementById('enemy-defense-badge').style.display = battleState.enemyDefending ? 'block' : 'none';

            // プレイヤーUI
            if (battleState.activeCard) {
                document.getElementById('active-card-img').innerText = battleState.activeCard.icon || '🃏';
                document.getElementById('active-card-name').innerText = battleState.activeCard.name || 'カード';
                document.getElementById('active-card-power').innerText = battleState.activeCard.power || 30;
                document.getElementById('player-hp-text').innerText = battleState.playerHp;
                document.getElementById('player-max-hp').innerText = battleState.playerMaxHp;
                document.getElementById('player-hp-fill').style.width = `${Math.max(0, (battleState.playerHp / battleState.playerMaxHp) * 100)}%`;
            }
            document.getElementById('player-energy-num').innerText = battleState.playerEnergy;
            document.getElementById('player-energy-container').innerHTML = Array(Math.min(battleState.playerEnergy, 10)).fill('<div class="energy-token"></div>').join('');
            document.getElementById('player-defense-badge').style.display = battleState.playerDefending ? 'block' : 'none';

            // 手札
            let handContainer = document.getElementById('player-hand-container');
            handContainer.innerHTML = "";
            let isP = (battleState.turnState === 'player');

            battleState.hand.forEach((cardId, index) => {
                let cId = (typeof cardId === 'object') ? cardId.id : cardId;
                let cObj = (typeof MASTER_CARDS !== 'undefined') ? MASTER_CARDS.find(c => c.id === cId) : null;
                if (!cObj) cObj = { name: 'カード', icon: '🃏' };

                let div = document.createElement('div');
                div.className = 'hand-card';
                div.innerHTML = `<span class="swap-tag">交代</span><div style="font-size:18px;">${cObj.icon}</div><div style="font-size:9px; font-weight:bold;">${cObj.name}</div>`;
                if (isP && battleState.playerEnergy >= 1) {
                    div.onclick = () => switchCardFromHand(index);
                } else { div.style.opacity = "0.5"; }
                handContainer.appendChild(div);
            });

            // ボタン有効化判定
            document.getElementById('card-attack-btn').disabled = (!isP || battleState.playerEnergy < 3);
            document.getElementById('card-defend-btn').disabled = (!isP || battleState.playerEnergy < 1 || battleState.playerDefending);
            document.getElementById('card-heal-btn').disabled = (!isP || battleState.playerEnergy < 1 || battleState.playerHp === battleState.playerMaxHp);
            document.getElementById('card-draw-btn').disabled = (!isP || battleState.playerEnergy < 1 || battleState.deck.length === 0);
            document.getElementById('end-turn-btn').disabled = (!isP);
        }

        function playerAction(type) {
            if (battleState.turnState !== 'player') return;

            if (type === 'attack' && battleState.playerEnergy >= 3) {
                battleState.playerEnergy -= 3;
                executeAttack();
            } else if (type === 'defend' && battleState.playerEnergy >= 1) {
                battleState.playerEnergy -= 1;
                battleState.playerDefending = true;
                logMsg(`🛡️ ぼうぎょの体勢をとった！ (次のダメージ半減)`);
                updateBattleUI();
            } else if (type === 'heal' && battleState.playerEnergy >= 1) {
                battleState.playerEnergy -= 1;
                let cardPower = battleState.activeCard ? (battleState.activeCard.power || 30) : 30;
                let healAmt = Math.floor(cardPower * 0.4);
                battleState.playerHp = Math.min(battleState.playerMaxHp, battleState.playerHp + healAmt);
                logMsg(`💚 HPを ${healAmt} 回復した！`);
                triggerAnim('player-card', 'anim-swap', 300);
                updateBattleUI();
            } else if (type === 'draw' && battleState.playerEnergy >= 1) {
                battleState.playerEnergy -= 1;
                if (battleState.deck.length > 0) battleState.hand.push(battleState.deck.pop());
                logMsg(`📥 山札からカードを1枚引いた！`);
                updateBattleUI();
            }
        }

        function switchCardFromHand(idx) {
            if (battleState.turnState !== 'player') return;
            battleState.playerEnergy -= 1;
            let newId = battleState.hand.splice(idx, 1)[0];
            battleState.hand.push(battleState.activeCard.id);
            setCardToActive(newId);
            logMsg(`🔄 ${battleState.activeCard.name} に交代した！`);
            updateBattleUI();
        }

        function executeAttack() {
            battleState.turnState = 'busy';
            let cardPower = battleState.activeCard ? (battleState.activeCard.power || 30) : 30;
            let dmg = Math.floor(cardPower * (1 + Math.random() * 0.2));
            
            if (battleState.enemyDefending) { 
                dmg = Math.floor(dmg / 2); 
                battleState.enemyDefending = false; 
            }
            
            // 攻撃アニメーション演出
            triggerAnim('player-card', 'anim-attack-p', 400);

            setTimeout(() => {
                battleState.enemyHp = Math.max(0, battleState.enemyHp - dmg);
                triggerAnim('enemy-card', 'anim-hit', 400);
                triggerAnim('main-playmat', 'anim-shake-screen', 300);
                updateBattleUI();

                if (battleState.enemyHp <= 0) {
                    logMsg(`🔥 てきに ${dmg} のダメージ！ てきをたおしたぞ！！`);
                    setTimeout(() => endBattle(true), 1200);
                } else {
                    logMsg(`🔥 てきに ${dmg} のダメージ！`);
                    setTimeout(() => startEnemyTurn(), 800);
                }
            }, 200);
        }

        function endPlayerTurn() {
            if (battleState.turnState !== 'player') return;
            startEnemyTurn();
        }

        function startEnemyTurn() {
            battleState.turnState = 'enemy';
            battleState.playerDefending = false;
            battleState.enemyEnergy = Math.min(10, battleState.enemyEnergy + 2);
            
            document.getElementById('battle-turn-indicator').innerText = "▶ てきのターン...";
            document.getElementById('battle-turn-indicator').style.color = "#ff6b81";
            logMsg(`⏩ ターン終了。相手の番になります。`);
            updateBattleUI();

            setTimeout(executeEnemyTurn, 1000);
        }

        function executeEnemyTurn() {
            if (battleState.enemyHp <= 0) return;

            if (battleState.enemyEnergy >= 3) {
                battleState.enemyEnergy -= 3;
                let enemyDmg = Math.floor(22 + Math.random() * 12);
                if (battleState.playerDefending) enemyDmg = Math.floor(enemyDmg / 2);
                
                triggerAnim('enemy-card', 'anim-attack-e', 400);
                
                setTimeout(() => {
                    battleState.playerHp = Math.max(0, battleState.playerHp - enemyDmg);
                    triggerAnim('player-card', 'anim-hit', 400);
                    triggerAnim('main-playmat', 'anim-shake-screen', 300);
                    logMsg(`💥 てきのこうげき！ ${enemyDmg} のダメージを受けた！`);
                    updateBattleUI();
                    checkPlayerStatus();
                }, 200);

            } else if (battleState.enemyEnergy >= 1 && Math.random() < 0.5) {
                battleState.enemyEnergy -= 1;
                battleState.enemyDefending = true;
                logMsg(`🛡️ てきは ぼうぎょの体勢をとった！`);
                updateBattleUI();
                checkPlayerStatus();
            } else {
                logMsg(`⚡ てきは パワーを溜めている...`);
                updateBattleUI();
                checkPlayerStatus();
            }
        }

        function checkPlayerStatus() {
            if (battleState.playerHp <= 0) {
                logMsg(`💥 カードがきぜつしてしまった…！`);
                setTimeout(() => {
                    if (battleState.hand.length > 0) {
                        let nextCardId = battleState.hand.shift();
                        setCardToActive(nextCardId);
                        logMsg(`🔄 つぎのカード「${battleState.activeCard.name}」をくりだした！`);
                        setTimeout(() => startPlayerTurn(), 1000);
                    } else { 
                        endBattle(false); 
                    }
                }, 1000);
            } else { 
                setTimeout(() => startPlayerTurn(), 1200); 
            }
        }

        function startPlayerTurn() {
            battleState.turnState = 'player';
            battleState.enemyDefending = false;
            battleState.playerEnergy = Math.min(10, battleState.playerEnergy + 2);
            
            document.getElementById('battle-turn-indicator').innerText = "▶ あなたのターン！";
            document.getElementById('battle-turn-indicator').style.color = "#7bed9f";
            logMsg(`▶ あなたのターン！ (エネルギー+2 チャージ)`);
            updateBattleUI();
        }

        function logMsg(msg) { document.getElementById('battle-log-msg').innerText = msg; }

        function endBattle(isWin) {
            document.getElementById('battle-action-screen').style.display = 'none';
            document.getElementById('battle-result-screen').style.display = 'block';
            let resText = document.getElementById('battle-result-text');
            
            if (isWin) { 
                playSpecialBGM('victory_fanfare.mp3'); // 勝利のファンファーレ
                let rewardText = `報酬: 💰 コイン +${battleState.rewardCoins}枚`;
                if (battleState.rewardPacks > 0) {
                    rewardText += ` ＆ 🎁 パック +${battleState.rewardPacks}個`;
                }
                resText.innerHTML = `🎉 大勝利！！<br><span style="color:#2ed573; font-size:22px;">${rewardText} ゲット！</span>`; 
                
                coins += battleState.rewardCoins;
                packs += battleState.rewardPacks;
                localStorage.setItem('coins', coins);
                localStorage.setItem('packs', packs);
            } else { 
                playSpecialBGM('lose.mp3'); // 敗北時BGM
                resText.innerHTML = `💥 ぜんめつ…敗北しました`; 
            }
        }

        updateBgmButtonUI();
    </script>
</body>
</html>
