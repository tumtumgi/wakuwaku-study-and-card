<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 パック開封 - わくわく学習＆カード</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase_client.js"></script>
    <script src="js/data_manager.js"></script>
    <script src="js/auth_controller.js"></script>
    <!-- 共通カードデータを読み込み -->
    <script src="js/cards_data.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSSはそのまま */
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            margin: 0; padding: 20px; color: #4a4a4a; text-align: center; min-height: 100vh;
            transition: background 0.5s ease;
        }
        body.dark { background: linear-gradient(135deg, #1e272e 0%, #4bcffa 100%); }
        body.pop { background: linear-gradient(135deg, #ff9ff3 0%, #feca57 100%); }

        .screen {
            background: rgba(255, 255, 255, 0.95); max-width: 650px; margin: 0 auto;
            padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        #status-bar {
            display: flex; justify-content: space-around; background: rgba(255, 255, 255, 0.9);
            color: #2f3640; padding: 12px; border-radius: 20px; margin: 0 auto 20px auto;
            max-width: 650px; font-size: 18px; font-weight: 900;
        }

        .pack-img { font-size: 80px; margin: 20px 0; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .card-result-grid {
            display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap;
        }
        .result-card {
            background: white; border: 3px solid #f1c40f; border-radius: 16px;
            padding: 15px; width: 120px; box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            animation: popIn 0.5s ease; display: flex; flex-direction: column; align-items: center;
        }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        .card-icon { font-size: 45px; margin: 5px 0; }
        .card-name { font-size: 13px; font-weight: 900; color: #2d3436; margin-bottom: 4px; }
        .card-rarity { font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 8px; color: white; display: inline-block; }
        .card-power { font-size: 11px; font-weight: bold; color: #e67e22; background: #fff3e0; padding: 2px 6px; border-radius: 8px; margin-top: 4px; display: inline-block; }
        
        .rare-N { background: #7f8fa6; }
        .rare-R { background: #2ed573; }
        .rare-SR { background: #3498db; }
        .rare-UR { background: #9b59b6; }
        .rare-SEC { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }

        button.open-btn {
            background: linear-gradient(180deg, #e67e22, #d35400); color: white; border: none;
            padding: 14px 28px; font-size: 20px; font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 900; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #a04000; width: 80%;
        }
        button.open-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

        button.nav-btn {
            background: #1abc9c; color: white; border: none; padding: 10px 20px;
            font-size: 16px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700;
            border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #16a085; margin: 5px;
        }
    </style>
</head>
<body id="body-pack">
    <div id="status-bar">
        <div>🪙 コイン: <span id="coin-display">0</span></div>
        <div>📦 パック: <span id="pack-display">0</span>個</div>
    </div>

    <div class="screen">
        <h2 style="color:#e67e22; margin-top:0;">📦 パックを開封しよう</h2>

        <div id="pack-view">
            <div class="pack-img">📦</div>
            <button id="open-btn" class="open-btn" onclick="openPack()">パックを開ける！</button>
        </div>

        <div id="result-view" style="display:none;">
            <h3>✨ 出てきたカード ✨</h3>
            <div id="result-container" class="card-result-grid"></div>
            <p style="font-weight:bold; color:#2ed573;">🎉 図鑑にカードが記録されました！</p>
            <div>
                <button class="nav-btn" onclick="location.href='pokedex.html'">📖 カード図鑑を見る</button>
                <button class="nav-btn" onclick="resetPackView()" style="background:#e67e22; box-shadow:0 4px 0 #d35400;">📦 もう一度開ける</button>
            </div>
        </div>

        <hr style="border: 1px dashed #ccc; margin: 20px 0;">
        <button class="nav-btn" onclick="location.href='index.html'" style="background:#7f8fa6; box-shadow:0 4px 0 #718093;">🏠 メニューにもどる</button>
    </div>

    <script>
        document.getElementById('body-pack').className = localStorage.getItem('theme') || 'dark';

        let currentPacks = parseInt(localStorage.getItem('packs')) || 0;
        let currentCoins = parseInt(localStorage.getItem('coins')) || 0;
        updateStatus();

        function updateStatus() {
            document.getElementById('coin-display').innerText = currentCoins;
            document.getElementById('pack-display').innerText = currentPacks;
            document.getElementById('open-btn').disabled = (currentPacks <= 0);
        }

        // --- 排出確率のロジック ---
        function drawCard() {
            const rand = Math.random() * 100; // 0 〜 99.999...
            let targetRarity = "N";

            if (rand < 2) {
                targetRarity = "SEC"; // 2% (0〜2)
            } else if (rand < 7) {
                targetRarity = "UR";  // 5% (2〜7)
            } else if (rand < 10) {
                targetRarity = "SR";  // 3% (7〜10)
            } else if (rand < 40) {
                targetRarity = "R";   // 30% (10〜40)
            } else {
                targetRarity = "N";   // 60% (40〜100)
            }

            // 決定したレアリティのカードだけを絞り込む
            const filteredCards = MASTER_CARDS.filter(c => c.rarity === targetRarity);
            
            // その中からランダムに1枚選ぶ
            const randomIndex = Math.floor(Math.random() * filteredCards.length);
            return filteredCards[randomIndex];
        }

        function openPack() {
            if (currentPacks <= 0) return;

            // パック数を減らす
            currentPacks--;
            localStorage.setItem('packs', currentPacks);
            updateStatus();

            // 確率に基づき3枚のカードを抽出
            let pulledCards = [];
            for (let i = 0; i < 3; i++) {
                pulledCards.push(drawCard());
            }

            // 共通関数から現在の所持コレクションを取得し追加保存
            let existingCollection = getPlayerCollection();
            pulledCards.forEach(c => existingCollection.push(c.id));
            localStorage.setItem('playerCollection', JSON.stringify(existingCollection));

            // 結果画面の表示
            const container = document.getElementById('result-container');
            container.innerHTML = "";
            pulledCards.forEach(card => {
                const el = document.createElement('div');
                el.className = 'result-card';
                el.innerHTML = `
                    <div class="card-icon">${card.icon}</div>
                    <div class="card-name">${card.name}</div>
                    <span class="card-rarity rare-${card.rarity}">${card.rarity}</span>
                    <div class="card-power">P:${card.power}</div>
                `;
                container.appendChild(el);
            });

            document.getElementById('pack-view').style.display = 'none';
            document.getElementById('result-view').style.display = 'block';
        }

        function resetPackView() {
            document.getElementById('result-view').style.display = 'none';
            document.getElementById('pack-view').style.display = 'block';
        }
    </script>
</body>
</html>
