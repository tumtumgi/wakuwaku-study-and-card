<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🌟 わくわく学習＆カード 🌟[cite: 1] - ログイン</title>

    <!-- Supabase関連の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase_client.js"></script>
    <script src="js/data_manager.js"></script>
    <script src="js/auth_controller.js"></script>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary { background-color: #4CAF50; color: white; }
        .btn-secondary { background-color: #2196F3; color: white; }
        .btn-guest { background-color: #ff9800; color: white; }
        .btn-link { background: none; color: #666; text-decoration: underline; font-size: 0.9em; margin-top: 10px; }
        #message {
            margin-top: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🌟 ログイン 🌟</h2>
        <input type="email" id="email" placeholder="メールアドレス">
        <input type="password" id="password" placeholder="パスワード">
        
        <button class="btn-primary" onclick="handleLogin()">ログイン</button>
        <button class="btn-secondary" onclick="handleSignUp()">新規登録</button>
        <button class="btn-guest" onclick="AuthController.playAsGuest()">セーブせずに遊ぶ（ゲスト）</button>
        
        <button class="btn-link" onclick="handleForgotPassword()">パスワードを忘れた場合</button>
        
        <p id="message"></p>
    </div>

    <script>
        const messageEl = document.getElementById('message');

        // ログイン処理
        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) {
                messageEl.style.color = '#d9534f';
                messageEl.innerText = "メールアドレスとパスワードを入力してください。";
                return;
            }
            try {
                await AuthController.login(email, password);
                window.location.href = 'menu.html';
            } catch (e) {
                messageEl.style.color = '#d9534f';
                messageEl.innerText = "ログイン失敗: " + e.message;
            }
        }

        // 新規登録処理
        async function handleSignUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) {
                messageEl.style.color = '#d9534f';
                messageEl.innerText = "メールアドレスとパスワードを入力してください。";
                return;
            }
            try {
                await AuthController.signUp(email, password);
                messageEl.style.color = '#4CAF50';
                messageEl.innerText = "確認メールを送信しました。メールをご確認ください。";
            } catch (e) {
                messageEl.style.color = '#d9534f';
                messageEl.innerText = "登録失敗: " + e.message;
            }
        }

        // パスワードリセット要求処理
        async function handleForgotPassword() {
            const email = document.getElementById('email').value;
            if (!email) {
                messageEl.style.color = '#d9534f';
                messageEl.innerText = "上部の入力欄にメールアドレスを入力してください。";
                return;
            }
            try {
                const { error } = await sbClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/update-password.html'
                });
                if (error) throw error;
                messageEl.style.color = '#4CAF50';
                messageEl.innerText = "パスワード再設定用のメールを送信しました。";
            } catch (e) {
                messageEl.style.color = '#d9534f';
                messageEl.innerText = "送信失敗: " + e.message;
            }
        }
    </script>

</body>
</html>
