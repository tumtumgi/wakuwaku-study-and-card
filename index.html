<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🌟 わくわく学習＆カード 🌟 - ログイン</title>

    <!-- Supabase関連の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase_client.js"></script>
    <script src="js/data_manager.js"></script>
    <script src="js/auth_controller.js"></script>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            /* 画像背景設定 */
            background-image: url('top.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* 背景を少し暗くして文字を見やすく */
            background-color: rgba(0, 0, 0, 0.4);
            background-blend-mode: darken;
        }

        .login-card {
            /* グラスモーフィズム */
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            color: #fff;
        }

        h2 {
            margin-bottom: 25px;
            color: #FFD700; /* ゴールド */
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-size: 1.5em;
        }

        .info-box {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.85em;
            text-align: left;
            color: #ddd;
            line-height: 1.6;
        }

        .info-box strong {
            color: #4fc3f7;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #555;
            border-radius: 8px;
            box-sizing: border-box;
            color: white;
            transition: border 0.3s;
        }

        input:focus {
            outline: none;
            border: 1px solid #4fc3f7;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: transform 0.2s, filter 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }

        .btn-primary { background: linear-gradient(135deg, #4caf50, #2e7d32); }
        .btn-secondary { background: linear-gradient(135deg, #2196f3, #1565c0); }
        .btn-guest { background: linear-gradient(135deg, #ff9800, #ef6c00); }
        
        .btn-link { 
            background: none; 
            color: #aaa; 
            text-decoration: underline; 
            font-size: 0.85em; 
            margin-top: 15px; 
            border: none;
        }

        #message {
            margin-top: 20px;
            font-size: 0.9em;
            text-shadow: 0 0 5px black;
        }
    </style>
</head>
<body>

    <!-- BGM用のオーディオタグ (ループ再生設定) -->
    <audio id="bgm" src="bgm/Dawn_of_the_Sky_Kingdom.mp3" loop preload="auto"></audio>

    <div class="login-card">
        <h2>🌟 ログイン 🌟</h2>

        <div class="info-box">
            <p><strong>☁️ メールアドレスでログイン</strong><br>
            どの端末からでもデータを引き継げます。</p>
            <p><strong>📱 ログインせずに遊ぶ</strong><br>
            この端末にのみデータを保存します。</p>
        </div>

        <input type="email" id="email" placeholder="メールアドレス">
        <input type="password" id="password" placeholder="パスワード">
        
        <button class="btn-primary" onclick="handleLogin()">ログイン</button>
        <button class="btn-secondary" onclick="handleSignUp()">新規登録</button>
        <button class="btn-guest" onclick="AuthController.playAsGuest()">ログインせずに遊ぶ</button>
        
        <button class="btn-link" onclick="handleForgotPassword()">パスワードを忘れた場合</button>
        
        <p id="message"></p>
    </div>

    <script>
        // 画面のどこかをクリックしたときにBGMを再生する処理
        document.body.addEventListener('click', () => {
            const bgm = document.getElementById('bgm');
            // まだ再生されていなければ再生を開始
            if (bgm.paused) {
                bgm.volume = 0.5; // 音量調整（0.0〜1.0の間でお好みで調整してください）
                bgm.play().catch(e => console.log('BGMの再生に失敗しました:', e));
            }
        }, { once: true }); // 最初の1回のクリック時だけ実行されるように設定


        const messageEl = document.getElementById('message');

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) {
                messageEl.style.color = '#ff5252';
                messageEl.innerText = "メールアドレスとパスワードを入力してください。";
                return;
            }
            try {
                await AuthController.login(email, password);
                window.location.href = 'menu.html';
            } catch (e) {
                messageEl.style.color = '#ff5252';
                messageEl.innerText = "ログイン失敗: " + e.message;
            }
        }

        async function handleSignUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) {
                messageEl.style.color = '#ff5252';
                messageEl.innerText = "メールアドレスとパスワードを入力してください。";
                return;
            }
            try {
                await AuthController.signUp(email, password);
                messageEl.style.color = '#4caf50';
                messageEl.innerText = "確認メールを送信しました。";
            } catch (e) {
                messageEl.style.color = '#ff5252';
                messageEl.innerText = "登録失敗: " + e.message;
            }
        }

        async function handleForgotPassword() {
            const email = document.getElementById('email').value;
            if (!email) {
                messageEl.style.color = '#ff5252';
                messageEl.innerText = "メールアドレスを入力してください。";
                return;
            }
            try {
                const { error } = await sbClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.href.replace('login.html', 'update-password.html')
                });
                if (error) throw error;
                messageEl.style.color = '#4caf50';
                messageEl.innerText = "再設定メールを送信しました。";
            } catch (e) {
                messageEl.style.color = '#ff5252';
                messageEl.innerText = "送信失敗: " + e.message;
            }
        }
    </script>
</body>
</html>
