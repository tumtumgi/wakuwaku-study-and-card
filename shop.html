<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ショップ - わくわく学習＆カード</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase_client.js"></script>
    <script src="js/data_manager.js"></script>
    <script src="js/auth_controller.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; margin: 0; padding: 20px; text-align: center; min-height: 100vh; }
        body.dark { background: linear-gradient(135deg, #1e272e, #4bcffa); }
        body.pop { background: linear-gradient(135deg, #ff9ff3, #feca57); }
        .screen { background: rgba(255, 255, 255, 0.95); max-width: 650px; margin: 0 auto; padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        button { background: #f1c40f; color: #2f3640; border: none; padding: 12px 24px; margin: 8px; font-size: 18px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #f39c12; }
        #status-bar { display: flex; justify-content: space-around; background: rgba(255, 255, 255, 0.9); padding: 12px; border-radius: 20px; margin: 0 auto 20px auto; max-width: 650px; font-weight: 900; }
    </style>
</head>
<body id="body-shop">
    <div id="status-bar">
        <div>🪙 コイン: <span id="coin-display">0</span></div>
        <div>📦 パック: <span id="pack-display">0</span>個</div>
    </div>

    <div class="screen">
        <h2 style="color:#f1c40f;">🛒 ショップ (パック交換)</h2>
        <p>あつめたコインでパックと交換しよう！</p>
        
        <div style="background:#f8f9fa; padding:15px; border-radius:12px; margin:15px 0; text-align:left; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h3 style="margin:0;">📦 拡張パック × 1</h3>
                <p style="margin:5px 0 0 0; color:#666;">価格: 🪙 100 コイン</p>
            </div>
            <button onclick="buyPack(100)" style="background:#e67e22; color:white; font-size:16px; padding:10px 20px; box-shadow: 0 4px 0 #d35400;">交換する</button>
        </div>

        <button onclick="location.href='menu.html'" style="background: #7f8fa6; color:white; box-shadow: 0 6px 0 #718093; margin-top:15px;">🏠 メニューにもどる</button>
    </div>

    <script>
        document.getElementById('body-shop').className = localStorage.getItem('theme') || 'dark';
        let coins = parseInt(localStorage.getItem('coins')) || 0;
        let packs = parseInt(localStorage.getItem('packs')) || 0;

        function updateUI() {
            document.getElementById('coin-display').innerText = coins;
            document.getElementById('pack-display').innerText = packs;
            localStorage.setItem('coins', coins);
            localStorage.setItem('packs', packs);
        }
        updateUI();

        function buyPack(cost) {
            if (coins < cost) {
                alert("コインが足りません！「問題を解く」で稼ぎましょう！");
                return;
            }
            coins -= cost;
            packs += 1;
            alert("拡張パックを1個手に入れました！");
            updateUI();
        }
    </script>
</body>
</html>
