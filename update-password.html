<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワードの再設定</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase_client.js"></script>
</head>
<body>
    <h2>新しいパスワードを設定</h2>
    <input type="password" id="new-password" placeholder="新しいパスワード"><br>
    <button onclick="updatePassword()">パスワードを変更する</button>

    <script>
        async function updatePassword() {
            const newPassword = document.getElementById('new-password').value;
            const { error } = await sbClient.auth.updateUser({ password: newPassword });
            
            if (error) {
                alert("更新失敗: " + error.message);
            } else {
                alert("パスワードを変更しました！");
                window.location.href = 'menu.html'; // 成功したらゲーム画面へ
            }
        }
    </script>
</body>
</html>
